realcar_path: ${oc.env:HUGSIM_DATA}/HUGSIM-public/3DRealCar
model_base: ${oc.env:HUGSIM_DATA}/HUGSIM-private/ss/scenes/waymo
uniad_path: ${oc.env:HUGSIM_AD_UNIAD,agents/uniad/launch.sh}
vad_path: ${oc.env:HUGSIM_AD_VAD,agents/vad/launch.sh}
ltf_path: ${oc.env:HUGSIM_AD_LTF,agents/ltf/launch.sh}
drivor_path: ${oc.env:HUGSIM_AD_DRIVOR,agents/drivor/launch.sh}
dynamo_path: ${oc.env:HUGSIM_AD_DYNAMO}
gtrs_path: ${oc.env:HUGSIM_AD_GTRS,agents/gtrs/launch.sh}
